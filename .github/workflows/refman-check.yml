name: refman-check

on:
  push:
  pull_request:

jobs:
  refman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate refman tooling is wired to Vyb
        # The generator is tools/refman.vyb -- a Vyb program -- so the real drift
        # check runs in the `ci` workflow's build job, where the compiler exists
        # (#226). This fast gate keeps the wiring honest: the Python generator is
        # gone, the ci job still runs the check, and the guide markers the
        # generator patches are intact.
        run: |
          set -euo pipefail
          test -f tools/refman.vyb
          test ! -f tools/refman.py
          grep -q 'VYB_REFMAN_CHECK=1' .github/workflows/ci.yml
          grep -q '<!-- refman:api-index begin -->' docs/refman/PROGRAMMERS_GUIDE.md
          grep -q '<!-- refman:api-index end -->' docs/refman/PROGRAMMERS_GUIDE.md
