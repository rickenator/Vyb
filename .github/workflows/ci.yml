name: ci

# Vyb CI (#150): build the compiler, run the canonical suite in JIT mode, add
# AOT/native-link coverage, and run a memory-safety (ASan) validation on a
# schedule and on push to main. The refman consistency check remains a separate
# documentation gate (refman-check.yml).

on:
  # Only main runs on push. A branch push alongside its own pull_request run made every
  # commit build twice (the PR run gated the heavy jobs out, the push run did the real
  # work), and with a single self-hosted GPU runner those duplicates queued behind each
  # other. Branches are exercised by their pull_request run; main keeps push + nightly.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily memory-safety run

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Build + JIT suite + AOT/native-link
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # #484: the toolchain comes from the image, so there is no apt step at all -- that
    # step was 32s on a good mirror and 5-20 minutes when the mirror misbehaved. The tag
    # is the Dockerfile's content hash; the pin check below fails if the two drift apart.
    container:
      image: ghcr.io/rickenator/vyb-ci:toolchain-d0f7901abd08
      # lldb disables ASLR with personality(2) before launching the fixture, and the
      # default seccomp profile answers EPERM ("Cannot launch ...: personality set failed:
      # Operation not permitted"), so the debugger-integration leg would fail for purely
      # environmental reasons. Unconfined seccomp for this one job -- it runs only this
      # repository's code inside this repository's image -- keeps gdb *and* lldb coverage.
      options: --security-opt seccomp=unconfined
    # #484: inside a container the runner defaults step shells to `sh`, where
    # `set -o pipefail` is illegal -- the shard/partition/pin steps all use it. Ask for
    # bash explicitly rather than sprinkling `shell:` on every step.
    defaults:
      run:
        shell: bash
    # #481: the compiler build is the other half of this job's cost, so it is cached
    # through ccache. A warm cache turns a multi-minute rebuild into seconds; the key
    # follows the compiler sources and `restore-keys` falls back to the newest cache,
    # where ccache's own content hashes still find every unchanged translation unit.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - name: Allow git on the mounted workspace (#484)
        # The runner owns the checked-out tree (/__w/Vyb/Vyb) but steps inside the
        # container run as root, so git refuses the repository with "dubious ownership"
        # and every git call comes back empty. That is not cosmetic: the refman generator
        # stamps HEAD into all 38 generated pages, so an empty rev read as drift in every
        # one of them ("commit: unknown" vs the real hash), failing the job for a reason
        # that has nothing to do with the docs.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify the toolchain image pin matches the Dockerfile (#484)
        # The jobs run inside the image the Dockerfile describes, so the pin is that
        # file's content hash. Editing the Dockerfile without repinning would leave CI on
        # an older environment than the tree claims -- caught here, not silently.
        run: |
          set -euo pipefail
          current=$(sha256sum .github/ci/Dockerfile | cut -c1-12)
          pins=$(grep -ohE 'vyb-ci:toolchain-[0-9a-f]{12}' .github/workflows/ci.yml .github/workflows/gpu-kernel.yml | sort -u)
          if [ "$pins" != "vyb-ci:toolchain-$current" ]; then
            echo "::error::the container pin(s) read '$pins' but the Dockerfile hashes to toolchain-$current; publish the image (ci-image workflow) and update both workflows"
            exit 1
          fi
          echo "toolchain image pin matches the Dockerfile: toolchain-$current"

      - name: Restore the compiler-object cache (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-release-${{ hashFiles('src/**', 'include/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-release-

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DLLVM_DIR=/usr/lib/llvm-18/cmake
          -DVYB_USE_QT5=OFF
          -DVYB_USE_OPENSSL=ON
          -DVYB_BINDGEN_LIBCLANG=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Report the compiler-object cache (#481)
        # Informational, never gating: a low hit rate is a signal to widen the key, not
        # a failure. Printed on every run so the cache's effect is visible in the log.
        if: always()
        run: ccache -s

      - name: Verify build identity (#160)
        # The binary must report build=Release (never silently Debug) + no sanitizer.
        run: test "$(./build/vyb --version)" = "Vyb $(grep '^project' CMakeLists.txt | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+') (build=Release, sanitize=none)"

      - name: Validate documented suite count matches runner (#226)
        # Vyb implementation of the old suite_count_check.py: the count must match
        # what test/run_tests.vyb actually runs.
        run: ./build/vyb test/suite_count_check.vyb

      - name: Full JIT suite - 4 shards in parallel (#481)
        # The runner executes tests serially, so the suite is split into four
        # round-robin shards (`--shard K/N`) and run concurrently. Shards partition the
        # runner's deterministic discovery list, and the next step asserts they add up
        # to the documented suite size -- a shard that ran nothing, or four shards that
        # ran the same slice, must fail rather than pass quietly.
        env:
          SHARDS: "4"
        run: |
          set -uo pipefail
          export VYB_STDLIB="$PWD/stdlib"
          rc=0
          for i in $(seq 0 $((SHARDS - 1))); do
            ./build/vyb test/run_tests.vyb --vyb build/vyb --test-dir test --shard "$i/$SHARDS" \
              --json "/tmp/suite-$i.json" --evidence "/tmp/evidence-$i.json" \
              > "/tmp/shard-$i.log" 2>&1 &
          done
          for p in $(jobs -p); do wait "$p" || rc=1; done
          cat /tmp/shard-*.log
          exit "$rc"

      - name: Verify the shards partition the suite (#481)
        # Compare file lists, not counts: CI legitimately skips tests whose libraries
        # are absent (the pre-shard run reports the same 7 skips), so an executed-count
        # comparison would measure the environment rather than the sharding. The union
        # of the four shard lists must equal the full discovery list exactly -- `diff`
        # exposes both a missing shard (lines only in "all") and a duplicated one (an
        # extra occurrence in the union).
        run: |
          set -euo pipefail
          export VYB_STDLIB="$PWD/stdlib"
          # `--list` prints the selected files; keep only the path lines (the JIT runner
          # also echoes main's return value, and a stray line here would look like a
          # missing test).
          runner() { ./build/vyb test/run_tests.vyb --test-dir test "$@"; }
          list() { runner "$@" --list | grep -E '\.vyb$' | LC_ALL=C sort; }
          list > /tmp/all.txt
          for i in $(seq 0 3); do
            list --shard "$i/4" > "/tmp/shard-$i.txt"
          done
          cat /tmp/shard-0.txt /tmp/shard-1.txt /tmp/shard-2.txt /tmp/shard-3.txt \
            | LC_ALL=C sort > /tmp/union.txt
          if ! diff -q /tmp/all.txt /tmp/union.txt > /dev/null; then
            echo "::error::the shards do not cover the suite exactly; diff of all vs union:"
            diff /tmp/all.txt /tmp/union.txt | head -30
            exit 1
          fi
          echo "$(wc -l < /tmp/all.txt) test files, partitioned exactly across 4 shards"

      - name: Optimization level reaches the JIT path (#394)
        # `-O` used to parse and then be ignored by the JIT path, which hardcoded
        # O2 -- so -O0/-O1/-O3 silently ran the O2 pipeline. Each level must both
        # select its own pipeline (asserted through --debug-codegen, which prints
        # "Skipping IR optimization (-O0)" or "Applying IR optimization passes
        # (-On)") and produce identical program output.
        run: |
          set -euo pipefail
          export VYB_STDLIB="$PWD/stdlib"
          f=test/modules/test_for_iter_struct_elem.vyb
          base=$(./build/vyb "$f")
          for lvl in 0 1 2 3; do
            out=$(./build/vyb "$f" "-O$lvl")
            if [ "$out" != "$base" ]; then
              echo "::error::output differs at -O$lvl: '$out' != '$base'"
              exit 1
            fi
            if [ "$lvl" = "0" ]; then
              ./build/vyb --debug-codegen "$f" -O0 2>&1 | grep -q 'Skipping IR optimization (-O0)'
            else
              ./build/vyb --debug-codegen "$f" "-O$lvl" 2>&1 | grep -q "Applying IR optimization passes (-O$lvl)"
            fi
          done
          echo "-O0..-O3 each select their own pipeline and agree on output"

      - name: Validate tracking docs agree with the tree (TODO.md / FEATURE_STATUS.md)
        # tools/docstatus.vyb enforces six invariants: every repo path cited in the
        # tracking docs resolves on disk; every unchecked 1.0 criterion carries an
        # `open: LABEL` marker (naming a ✅ FEATURE_STATUS row is a contradiction);
        # no shipped TODO.md item's row still reads 📋/🚧 (curated pair table, plus
        # every item carrying a `shipped: LABEL` marker); and
        # the README's release link names the version CMakeLists.txt builds, which
        # CHANGELOG.md must also have a section for.
        # It calls exit(1) on drift, so the step fails for real.
        run: ./build/vyb tools/docstatus.vyb

      - name: Validate generated refman matches stdlib (#226)
        # tools/refman.vyb is the Vyb generator that replaced tools/refman.py.
        # VYB_REFMAN_CHECK=1 is its check mode (the compiler claims bare --check
        # for its own formatter check). It runs here because this job builds the
        # compiler; refman-check.yml only guards the wiring.
        run: |
          VYB_REFMAN_CHECK=1 ./build/vyb tools/refman.vyb
          git diff --quiet -- docs/refman || {
            echo "::error::docs/refman is stale; run: build/vyb tools/refman.vyb"
            git diff --stat -- docs/refman
            exit 1
          }

      - name: AOT / native-link coverage
        run: |
          ./test_compilation.sh --json /tmp/aot-evidence.json
          # test_compilation emits per-test outputs + .o at the repo root; remove
          # them so the tree stays clean even if a later step fails.
          rm -f test_output_* ./*.o 2>/dev/null || true

      - name: Debugger integration (#390)
        # DWARF is emitted for every host build; this proves a debugger can use it:
        # a breakpoint set by Vyb source line stops at that statement, stepping
        # works, and a local reads back. Both legs run in batch mode; the script
        # reports and skips any debugger that is not installed.
        run: ./test/debug_step.sh

      - name: Upload release evidence (#158)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            /tmp/suite-*.json
            /tmp/evidence-*.json
            /tmp/shard-*.log
            /tmp/aot-evidence.json
          if-no-files-found: ignore

  asan:
    name: Memory-safety (ASan full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Memory-safety on main push + the daily schedule; not on every PR to keep
    # PR feedback fast (ASan+JIT is slow).
    if: ${{ github.event_name != 'pull_request' }}
    # #484: the toolchain comes from the image, so there is no apt step at all -- that
    # step was 32s on a good mirror and 5-20 minutes when the mirror misbehaved. The tag
    # is the Dockerfile's content hash; the pin check below fails if the two drift apart.
    container:
      image: ghcr.io/rickenator/vyb-ci:toolchain-d0f7901abd08
    # #484: inside a container the runner defaults step shells to `sh`, where
    # `set -o pipefail` is illegal -- the shard and pin steps here use it. Ask for bash
    # explicitly rather than sprinkling `shell:` on every step.
    defaults:
      run:
        shell: bash
    # #481: same ccache treatment as the suite job, with its own key because the
    # sanitizer flags produce different objects. This job rebuilds a Debug+ASan
    # compiler from scratch on every main push otherwise.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4

      - name: Allow git on the mounted workspace (#484)
        # The runner owns the checked-out tree (/__w/Vyb/Vyb) but steps inside the
        # container run as root, so git refuses the repository with "dubious ownership"
        # and every git call comes back empty. That is not cosmetic: the refman generator
        # stamps HEAD into all 38 generated pages, so an empty rev read as drift in every
        # one of them ("commit: unknown" vs the real hash), failing the job for a reason
        # that has nothing to do with the docs.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore the ASan compiler-object cache (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-asan-${{ hashFiles('src/**', 'include/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-asan-

      - name: Configure (ASan)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DLLVM_DIR=/usr/lib/llvm-18/cmake
          -DVYB_USE_QT5=OFF
          -DVYB_USE_OPENSSL=ON
          -DVYB_BINDGEN_LIBCLANG=OFF
          -DVYB_SANITIZE="address,undefined"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (ASan)
        run: cmake --build build --parallel 2

      - name: Verify build identity (#160)
        # The ASan binary must report sanitize=address,undefined so coverage is
        # unambiguously part of the artifact.
        run: ./build/vyb --version | grep -E "sanitize=address,undefined"

      - name: Run full suite under ASan
        # halt_on_error aborts on the first real memory error; detect_leaks=1 runs
        # LeakSanitizer too so any retained/unreachable allocation fails the job.
        # The suite is leak-clean end to end, so LSan gates on regressions: the old
        # "@skip-asan" tests were real bugs (async_pump_main UAF #155, our/mild
        # control-block leaks #193), all fixed, and none remain. LSan covers the
        # whole tree exactly as it runs here.
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1"
          VYB_ASAN: "1"
        run: ./build/vyb test/run_tests.vyb --vyb build/vyb --test-dir test --json /tmp/asan-suite.json --evidence /tmp/asan-evidence.json

      - name: Abandoning-handler path stays leak-free (#398)
        # A handler that re-raises an error no enclosing trap can catch leaves the
        # frame through a non-returning runtime abort, so the caught error has to be
        # freed *before* that call. `test/trap/refail_test.vyb` is the negative
        # fixture for that path (it exits non-zero by design), hence not part of the
        # suite: assert its exit status and its freedom from leaks explicitly.
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1"
        run: |
          set +e
          out=$(./build/vyb --module-path stdlib test/trap/refail_test.vyb 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -8
          if [ "$rc" -eq 0 ]; then
            echo "::error::refail_test.vyb must exit non-zero (untrapped wrapped refail)"
            exit 1
          fi
          if echo "$out" | grep -q 'LeakSanitizer'; then
            echo "::error::leaked on the abandoning-handler path"
            exit 1
          fi
          echo "abandoning-handler path: non-zero exit, no leak"

      - name: Upload ASan release evidence (#158)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-evidence
          path: |
            /tmp/asan-suite.json
            /tmp/asan-evidence.json
          if-no-files-found: ignore
